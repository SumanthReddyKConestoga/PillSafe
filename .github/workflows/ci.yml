name: CI

"on":
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Sprint-0/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r Sprint-0/backend/requirements.txt

      - name: Run tests
        working-directory: Sprint-0/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./pillsafe_test.db
          SECRET_KEY: ci-test-secret-key
          APP_ENV: test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Sprint-0/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Sprint-0/frontend
        run: npm install

      - name: Type check
        working-directory: Sprint-0/frontend
        run: npm run type-check

      - name: Build
        working-directory: Sprint-0/frontend
        run: npm run build
